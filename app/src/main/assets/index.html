<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hangar Vault</title>
<style>
:root{--primary:#6750A4;--on-primary:#fff;--pc:#EADDFF;--on-pc:#21005D;--sc:#E8DEF8;--on-sc:#1D192B;--tc:#FFD8E4;--on-tc:#31111D;--surface:#FEF7FF;--on-surface:#1D1B20;--sv:#ECE6F0;--outline:#79747E;--card:#F3EDF7;--bl:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--on-surface);font:400 14px/1.4 "Google Sans",Roboto,system-ui,sans-serif;overflow:hidden}
svg{display:block}button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;z-index:0}
.bgl{position:absolute;inset:0;overflow:hidden;background:var(--surface)}
.bgl .fx{position:absolute;inset:0}
.b-grad .fx{background:linear-gradient(180deg,var(--pc),transparent 60%)}
.b-aurora i{position:absolute;border-radius:50%;filter:blur(var(--bl));opacity:.55;animation:dr 18s ease-in-out infinite alternate}
.b-aurora i:nth-child(1){width:80%;height:50%;left:-20%;top:-10%;background:var(--primary);opacity:.35}
.b-aurora i:nth-child(2){width:70%;height:45%;right:-25%;top:25%;background:var(--tc);animation-delay:-6s}
.b-aurora i:nth-child(3){width:75%;height:45%;left:-10%;bottom:-15%;background:var(--pc);animation-delay:-11s}
@keyframes dr{to{transform:translate(12%,8%) scale(1.15)}}
.b-dots .fx{background:radial-gradient(var(--outline) 1.3px,transparent 1.8px) 0 0/22px 22px;opacity:.3}
.b-grid .fx{background:linear-gradient(var(--outline) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,var(--outline) 1px,transparent 1px) 0 0/30px 30px;opacity:.16;-webkit-mask-image:linear-gradient(#000,transparent 90%)}
.b-waves svg{position:absolute;left:0;bottom:0;width:100%;height:60%}
.b-dia .fx{background:var(--outline);opacity:.12;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 6l8 18-8 18-8-18z' fill='black'/></svg>") 0 0/48px 48px}
.view{position:fixed;inset:0;z-index:1;overflow-y:auto;padding:var(--sat,0px) 0 120px;display:none}
.view.on{display:block;animation:vi .28s cubic-bezier(.2,0,0,1)}
@keyframes vi{from{opacity:0;transform:translateY(10px)}}
#v-prof{z-index:3;background:var(--surface)}
header{padding:36px 24px 8px}
h1{margin:0;font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.3px}
h2{margin:20px 24px 8px;font-size:14px;font-weight:600;color:var(--primary)}
.sub{opacity:.7}
.glass{background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.search{margin:12px 16px 4px;height:56px;border-radius:28px;background:color-mix(in srgb,var(--sv) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;padding:0 20px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:inherit;outline:none}
.search input::placeholder{color:inherit;opacity:.6}
.feat{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.feat::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.fc{flex:none;width:272px;height:172px;border-radius:32px;padding:20px;position:relative;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end}
.fc .big{position:absolute;right:-14px;top:-14px;width:120px;height:120px;opacity:.22;transform:rotate(12deg)}
.fc .big svg{width:100%;height:100%}
.fc .nm{font-size:22px;font-weight:600;line-height:26px;position:relative}
.fc .au{font-size:13px;opacity:.8;display:flex;align-items:center;gap:6px;position:relative;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chip{flex:none;height:32px;border-radius:8px;border:1px solid var(--outline);background:none;display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:500}
.chip.on{background:var(--sc);color:var(--on-sc);border-color:transparent;padding-left:8px}
.chip svg{width:18px;height:18px}
.list{padding:8px 16px 0}
.app{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:2px;border-radius:6px;animation:in .4s cubic-bezier(.2,0,0,1) both;cursor:pointer}
.app:first-child{border-radius:28px 28px 6px 6px}.app:last-child{border-radius:6px 6px 28px 28px}.app:only-child{border-radius:28px}
.app:active{filter:brightness(.96)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.ic{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;overflow:hidden}
.ic svg{width:28px;height:28px}.ic img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.nm{font-size:16px;font-weight:600;line-height:22px;display:flex;align-items:center;gap:6px}
.au{display:flex;align-items:center;gap:6px;font-size:12.5px}
.meta{font-size:12px;opacity:.7}
.ds{font-size:13px;margin-top:3px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.bd{flex:none}
.go{width:48px;height:48px;border-radius:24px;border:0;flex:none;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;transition:border-radius .25s,transform .15s}
.go:active{transform:scale(.92);border-radius:16px}
.go.busy svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{text-align:center;opacity:.6;font-size:12px;padding:12px 16px}
.empty{text-align:center;padding:56px 24px;opacity:.85}
.empty .ic{width:80px;height:80px;border-radius:40px;margin:0 auto 16px;background:var(--pc);color:var(--on-pc)}
.empty .ic svg{width:36px;height:36px}
.sk{height:84px;margin:0 16px 2px;border-radius:6px;background:var(--card);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.5}}
/* авторы */
.pc{display:flex;align-items:center;gap:16px;padding:16px 20px;margin:0 16px 8px;border-radius:28px;cursor:pointer}
.pc .info .nm{font-size:17px}
.back{margin:12px 12px 0;width:48px;height:48px;border-radius:24px;border:0;background:none;display:grid;place-items:center}
.ph{text-align:center;padding:0 24px 12px}
.ph .av{width:96px;height:96px;font-size:40px;margin-bottom:12px}
.ph .nm{justify-content:center;font-size:26px;line-height:32px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--sc);color:var(--on-sc);font-size:12.5px;font-weight:500;margin:8px 0}
.ph p{margin:4px 0 0;opacity:.8}
/* настройки */
.seg{display:flex;margin:0 16px;border:1px solid var(--outline);border-radius:20px;overflow:hidden;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.seg button{flex:1;height:40px;border:0;border-left:1px solid var(--outline);background:none;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--sc);color:var(--on-sc)}
.seg svg{width:18px;height:18px}
.sw{display:flex;flex-wrap:wrap;gap:12px;padding:0 20px}
.sw button{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff}
.sw button.on{outline:3px solid var(--on-surface);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;padding:0 16px}
.tile{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;border:0;padding:0;background:none;outline:1px solid var(--outline);--bl:14px}
.tile .tn{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 8px;text-align:center;font-weight:600;font-size:12.5px;background:linear-gradient(transparent,color-mix(in srgb,var(--surface) 90%,transparent))}
.tile.on{outline:3px solid var(--primary)}
.tile .ck{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.tile .ck svg{width:16px;height:16px}
.btn{margin:0 16px;height:48px;border-radius:24px;border:0;background:var(--sc);color:var(--on-sc);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 24px}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn svg,.back svg{width:22px;height:22px}
.search svg{flex:none}
/* нижняя навигация */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;height:calc(80px + var(--sab,0px));padding:12px 2px var(--sab,0px);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#nav button{flex:1 1 0;min-width:0;color:inherit;white-space:nowrap;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;opacity:.75}
#nav .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s,width .25s}
#nav svg{width:24px;height:24px}
#nav button.on{opacity:1;font-weight:700}
#nav button.on .pill{background:var(--pc);color:var(--on-pc)}
/* карточка приложения */
#scrim{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:86%;overflow-y:auto;background:var(--surface);border-radius:32px 32px 0 0;padding:12px 24px calc(24px + var(--sab,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,0,0,1)}
body.sh #scrim{opacity:1;pointer-events:auto}body.sh #sheet{transform:none}
.grab{width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.5;margin:0 auto 20px}
.sh-top{display:flex;gap:16px;align-items:center}
.sh-top .ic{width:72px;height:72px;border-radius:22px}.sh-top .ic svg{width:38px;height:38px}
.sh-top .nm{font-size:22px;line-height:28px}
.who{display:inline-flex;align-items:center;gap:8px;margin-top:4px;border:0;background:none;padding:0;font-weight:500;color:var(--primary)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.fact{height:28px;padding:0 12px;border-radius:14px;background:var(--sc);color:var(--on-sc);font-size:12.5px;font-weight:500;display:flex;align-items:center}
.full{font-size:14.5px;line-height:1.5;white-space:pre-wrap;margin-bottom:20px}
#sheet .btn{margin:0;width:100%;height:52px;border-radius:26px}
/* режим автора */
.fab{position:fixed;right:16px;bottom:calc(96px + var(--sab,0px));z-index:2;height:56px;border-radius:16px;padding:0 22px 0 18px;border:0;background:var(--pc);color:var(--on-pc);font-weight:600;font-size:15px;display:none;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.fab svg{width:24px;height:24px}.fab:active{transform:scale(.96)}
.fl{display:block;margin:0 0 12px}.fl span{display:block;font-size:12px;font-weight:600;opacity:.7;margin:0 0 4px 4px}
.fl input,.fl select,.fl textarea{width:100%;border:0;border-radius:14px;background:var(--sv);color:inherit;font:inherit;font-size:16px;padding:14px 16px;outline:none}
.fl input:focus,.fl select:focus,.fl textarea:focus{box-shadow:0 0 0 2px var(--primary)}
.pg{height:6px;border-radius:3px;background:var(--sc);overflow:hidden;margin:12px 0 4px}.pg i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s}
#sheet .btn.dng{background:none;color:#d32f2f;margin-top:8px;height:48px}
#sheet .btn:disabled{opacity:.5}
body.na #nav,body.na .fab{display:none!important}
.bn{display:block;width:calc(100% - 32px);margin:8px 16px;height:128px;object-fit:cover;border-radius:24px}
.sh-bn{width:100%;margin:0 0 16px;height:120px}
.post{margin:0 16px 12px;padding:16px;border-radius:24px}
.post .au{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pimg{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:16px;margin-top:8px}
.prow{display:flex;gap:8px;margin-top:12px}
.msgs{max-height:48vh;overflow-y:auto;padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.msg{align-self:flex-start;max-width:85%;padding:10px 14px;border-radius:18px;background:var(--sv);word-break:break-word}
.msg.me{align-self:flex-end;background:var(--pc);color:var(--on-pc)}
.msg .meta{font-size:11px;opacity:.7}.msg a{text-decoration:underline}
.upd{display:flex;align-items:center;gap:12px;margin:0 16px 12px;padding:12px 16px;border-radius:24px;justify-content:space-between}
.upd .btn{margin:0;flex:none;height:40px}
.ichip{background:var(--tc);color:var(--on-tc)}
#v-cm{z-index:3;background:var(--surface)}

/* анимации и форма */
#toast{position:fixed;left:50%;bottom:calc(104px + var(--sab,0px));z-index:9;transform:translate(-50%,20px);background:var(--on-surface);color:var(--surface);padding:12px 20px;border-radius:24px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,0,0,1);max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.app,.pc,.post,.fc,.btn,.chip,.fact,.fl input,.fl textarea,.seg button,.tile,.sw button{transition:background-color .3s,color .3s,transform .22s cubic-bezier(.2,0,0,1),outline-color .25s,box-shadow .25s,filter .2s}
.pc,.post,.fc{animation:in .45s cubic-bezier(.2,0,0,1) both}
.app:nth-child(2),.pc:nth-child(2),.fc:nth-child(2){animation-delay:.04s}.app:nth-child(3),.pc:nth-child(3),.fc:nth-child(3){animation-delay:.08s}
.app:nth-child(4),.pc:nth-child(4),.fc:nth-child(4){animation-delay:.12s}.app:nth-child(5),.pc:nth-child(5){animation-delay:.16s}
.app:nth-child(6),.pc:nth-child(6){animation-delay:.2s}.app:nth-child(n+7),.pc:nth-child(n+7){animation-delay:.24s}
.app:active,.pc:active,.fc:active{transform:scale(.98)}
.btn:active,.chip:active,.seg button:active,.tile:active,.sw button:active{transform:scale(.95)}
.sw button.on{outline-color:var(--on-surface)}
.sw button{outline:3px solid transparent;outline-offset:2px}
#v-prof.on{animation:pi .34s cubic-bezier(.2,0,0,1)}
@keyframes pi{from{opacity:0;transform:translateX(28px)}}
#nav button{transition:opacity .25s,transform .2s}#nav button:active{transform:scale(.92)}
#nav button.on svg{animation:bump .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes bump{from{transform:scale(.7)}}
#sheet{transition:transform .42s cubic-bezier(.2,.9,.25,1)}
.cc{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)!important}
.cc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
body.noanim *,body.noanim *::before{animation:none!important;transition:none!important}
body.r0 .app,body.r0 .pc,body.r0 .fc,body.r0 .post,body.r0 .bn,body.r0 .tile,body.r0 .pimg,body.r0 .search{border-radius:6px!important}
body.r0 .btn,body.r0 .go,body.r0 .fab,body.r0 #sheet .btn{border-radius:8px!important}

body.r2 .app,body.r2 .pc,body.r2 .post,body.r2 .bn,body.r2 .tile{border-radius:40px!important}

body.fs0 .view,body.fs0 #sheet,body.fs0 #nav{zoom:.9}
body.fs2 .view,body.fs2 #sheet,body.fs2 #nav{zoom:1.12}
/* порядок: плавающая нижняя панель, ровные кнопки, ничего не наезжает */
#nav{left:14px;right:14px;bottom:calc(14px + var(--sab,0px));height:68px;padding:8px 6px;border-radius:34px;background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 10px 28px rgba(0,0,0,.3),0 0 0 1px color-mix(in srgb,var(--outline) 30%,transparent)}
#nav button{justify-content:center;gap:2px}
#nav .pill{width:52px;height:30px;border-radius:15px}
.view{padding-bottom:150px}
.fab{bottom:calc(112px + var(--sab,0px))}
#toast{bottom:calc(120px + var(--sab,0px))}
.glass{background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none}
.search{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--sv)}
.btn{width:calc(100% - 32px);margin:0 16px 10px}
.sw{margin-bottom:18px}
.tiles{grid-template-columns:repeat(3,1fr)}
.tile{aspect-ratio:1/1.1}
.app .nm,.pc .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .info,.pc .info{min-width:0}

.app .ds{overflow-wrap:anywhere}
.feat{scroll-padding-left:16px;scroll-padding-right:16px}
.upd .btn,.btn[style*="flex:1"]{width:auto;margin:0}
.upd span{flex:1;min-width:0}
.view{overflow-x:hidden}

  var u=A[ME.username]||{name:ME.name||ME.username,bio:ME.bio||'',avatar:ME.avatar,badge:''};if(u.accent==null)u.accent=ME.accent||'';u.accent=pac=(pacSet?pac:u.accent);
  el.innerHTML='<div class="pc glass" style="cursor:default">'+av(ME.username,56)+'<div class="info"><div class="nm">'+esc(u.name)+badge(u.badge,18)+'</div><div class="meta">@'+esc(ME.username)+' · '+(ME.admin?'админ':ME.dev?'разработчик':'пользователь')+'</div></div></div><div style="padding:8px 16px 0">'+fld('Имя','<input id="p-n" value="'+esc(u.name)+'">')+fld('О себе','<textarea id="p-b" rows="2">'+esc(u.bio||'')+'</textarea>')+'<div class="meta" style="margin:8px 0">Цвет профиля</div><div class="sw" id="p-ac">'+['','262','215','185','145','95','35','350'].map(function(h){return '<button data-pac="'+h+'" class="'+((u.accent||'')==h?'on':'')+'" style="background:'+(h?hsl(+h,55,isDark()?65:45):'var(--surface-var,#888)')+'">'+((u.accent||'')==h?ico('check'):'')+'</button>'}).join('')+'</div></div><button class="btn" data-own="photo" style="margin-bottom:8px">Сменить фото</button><button class="btn" data-own="banner" style="margin-bottom:8px">Баннер профиля</button><button class="btn pri" data-own="save">Сохранить профиль</button><button class="btn" style="margin-top:8px" data-own="out">Выйти</button>'+'<div id="req"></div>'+'<div class="note" id="own-msg"></div>';
}
var pacSet=false,reqs=[],myReq=false;
function drawReq(){
  var el=document.getElementById('req');if(!el||!OWN)return;
  if(ME.admin){el.innerHTML='<h2>Заявки на разработчика</h2>'+(reqs.length?reqs.map(function(r){var p=r.profiles||{};return '<div class="full" style="margin:0 16px 12px"><b>'+esc(p.name||p.username)+'</b> @'+esc(p.username)+'<br>'+esc(r.text)+'<div style="display:flex;gap:8px;margin-top:8px"><button class="btn pri" data-req="1" data-u="'+esc(p.username)+'" style="flex:1">Принять</button><button class="btn" data-req="0" data-u="'+esc(p.username)+'" style="flex:1">Отклонить</button></div></div>'}).join(''):'<div class="note">Заявок нет</div>');return}
  if(ME.dev){el.innerHTML='';return}
  el.innerHTML='<h2>Стать разработчиком</h2><div class="note">Ты пока пользователь: можешь скачивать. Чтобы выкладывать приложения, расскажи о себе и что хочешь выкладывать, админ рассмотрит заявку.</div>'+(myReq?'<div class="note">Заявка отправлена, ждёт ответа админа.</div>':'<div style="padding:0 16px">'+fld('О себе и что будешь выкладывать','<textarea id="req-t" rows="4" placeholder="Кто ты, что делаешь, примеры (можно ссылки)"></textarea>')+'</div><button class="btn pri" data-own="req">Подать заявку</button>')+'<div class="note" id="req-msg"></div>';
}
function onRequests(j){try{reqs=JSON.parse(j)}catch(e){reqs=[]}myReq=!ME.admin&&reqs.length>0;drawReq()}
function onReqSent(ok,t){if(!ok){var m=document.getElementById('req-msg');if(m)m.textContent=t;return}ownerInfo();Store.loadRequests();load()}
function ownAct(a){
  if(a=='out'){Store.logout();A={};apps=[];ownerInfo();onNeedLogin();return}
  if(a=='photo'){Store.pickAvatar();return}
  if(a=='page'){openProf(ME.username);return}
  if(a=='banner'){imgPick('pbanner',function(){document.getElementById('own-msg').textContent='Загружаю баннер';imgUp('pbanner',function(ok,u){if(ok)Store.saveProfile(JSON.stringify({name:g('p-n'),bio:g('p-b'),accent:pac,banner:u}));else document.getElementById('own-msg').textContent=u})});return}
  if(a=='req'){var t=g('req-t');if(t.length<10){document.getElementById('req-msg').textContent='Напиши хотя бы пару предложений';return}document.getElementById('req-msg').textContent='Отправляю';Store.sendRequest(t);return}
  document.getElementById('own-msg').textContent='Сохраняю';Store.saveProfile(JSON.stringify({name:g('p-n'),bio:g('p-b'),accent:pac}));
}
function onSaved(ok,t){pacSet=false;ownerInfo();if(ok)setTimeout(drawOwn,0);var m=document.getElementById('own-msg');if(m)m.textContent=ok?'Сохранено':t;if(ok){load();if(prof)openProf(prof)}}
function openUpload(id){
  autoIcon='';picked=false;pickedIc=false;pickedBn=false;editId=id||'';
  var a=editId?apps.filter(function(x){return(x.id||x.name)==editId})[0]:null;a=a||{};
  var ty=[['','Определить сам']].concat(Object.keys(TYPES).map(function(k){return[k,TYPES[k]]})).map(function(t){return '<option value="'+t[0]+'"'+(a.type==t[0]?' selected':'')+'>'+t[1]+'</option>'}).join('');
  document.getElementById('sheet').innerHTML='<div class="grab"></div><div class="nm" style="font-size:22px;margin-bottom:16px">'+(editId?'Изменить запись':'Новая запись')+'</div><button class="btn" id="pick">'+ico('file')+(editId?'Заменить файл':'Выбрать файл')+'</button><div class="meta" id="pf" style="margin:8px 0 16px">'+(editId?'Файл можно не менять':'Файл не выбран (до 50 МБ)')+'</div>'+fld('Или ссылка (для больших файлов и чужих игр)','<input id="u-l" placeholder="https://" autocapitalize="none" value="'+esc(isSite(a)?fl(a):'')+'">')+'<label class="fl" style="flex-direction:row;gap:10px;align-items:center"><input type="checkbox" id="u-s"'+(isSite(a)?' checked':'')+' style="width:20px;height:20px"><span>Ссылка ведёт на сайт, а не на файл. Игрока перекинет на этот сайт.</span></label>'+'<button class="btn" id="pick-bn">'+ico('image')+'Баннер записи</button><div class="meta" id="pbn" style="margin:8px 0 16px">'+(a.banner?'Баннер уже есть, можно заменить':'Без баннера')+'</div><button class="btn" id="pick-ic">'+ico('image')+'Значок приложения</button><div class="meta" id="pic" style="margin:8px 0 16px">'+(a.icon?'Значок уже есть, можно заменить':'Без значка (по желанию, картинка)')+'</div>'+fld('Название','<input id="u-n" value="'+esc(a.name||'')+'">')+fld('Версия','<input id="u-v" placeholder="1.0" value="'+esc(a.version||'')+'">')+fld('Описание','<textarea id="u-d" rows="3">'+esc(a.desc||'')+'</textarea>')+fld('Теги через запятую','<input id="u-g" placeholder="1.21, Fabric" value="'+esc((a.tags||[]).join(', '))+'">')+fld('Тип','<select id="u-t">'+ty+'</select>')+'<div class="pg"><i id="pgi"></i></div><div class="note" id="pmsg"></div><button class="btn pri" id="pub">'+ico('download')+(editId?'Сохранить':'Опубликовать')+'</button>';
  document.body.classList.add('sh');
}
var pickedIc=false,pickedBn=false;
function onIconPicked(n){pickedIc=true;document.getElementById('pic').textContent=n}
function onPicked(name,size){picked=true;var tg=document.getElementById('u-g');if(tg&&!tg.value&&/\.(mcworld|mcpack|mcaddon|mctemplate|jar|mrpack|litemod)$/i.test(name))tg.value=mcTags(name).join(', ');document.getElementById('pf').textContent=name+' · '+fmt(size);var n=document.getElementById('u-n');if(n&&!n.value)n.value=name.replace(/\.[^.]*$/,'')}
function publish(){
  var a0=editId?apps.filter(function(x){return(x.id||x.name)==editId})[0]:null;var n=g('u-n'),l=g('u-l');if(!editId&&!picked&&!l){msg('Выбери файл или вставь ссылку');return}if(!n){msg('Введи название');return}
  var o={name:n,version:g('u-v'),desc:g('u-d'),tags:g('u-g'),type:g('u-t'),newFile:picked&&!l,link:l,site:!!(document.getElementById('u-s')||{}).checked,newIcon:pickedIc,newBanner:pickedBn};if(!pickedIc&&autoIcon&&!(a0&&a0.icon))o.icon=autoIcon;
  if(editId){var a=apps.filter(function(x){return(x.id||x.name)==editId})[0]||{};o.id=editId;o.file=a.file||'';o.size=a.size||'';o.icon=a.icon||'';o.banner=a.banner||''}
  document.getElementById('pub').disabled=true;msg('Начинаю');
  Store.upload(JSON.stringify(o));
}
function onUploadProgress(p){msg('Загрузка '+p+'%');var i=document.getElementById('pgi');if(i)i.style.width=p+'%'}
function onUploadStage(t){msg(t)}
function onUploadDone(ok,t){if(ok){closeSheet();load();document.getElementById('note').textContent='Опубликовано.'}else{msg(t);var b=document.getElementById('pub');if(b)b.disabled=false}}
function rmApp(b){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Нажми ещё раз, чтобы убрать';return}var a=apps.filter(function(x){return(x.id||x.name)==b.dataset.rm})[0]||{};Store.remove(b.dataset.rm,a.file||'')}
function onRemoved(ok,t){closeSheet();if(ok){load();toast('Удалено')}else toast('Не удалилось: '+t)}
function openHelp(){
  var st=[['Загрузить файл','Нажми плюс на главной, выбери файл с телефона: APK, мир или мод для Minecraft, jar. Тип определится сам. Размер до 50 МБ.'],['Большой файл или ссылка','Если файл больше 50 МБ, положи его в облако и вставь ссылку в поле «Или ссылка на файл». Ссылка должна начинаться с https://. Если она ведёт прямо на файл (в браузере он сразу скачивается), игрок скачает его в магазине. Если это страница сайта, например официальный сайт игры, поставь галочку «Ссылка ведёт на сайт»: по кнопке игрока перекинет туда.'],['Значок приложения','Кнопка «Значок приложения» в форме загрузки: выбери картинку. Её увидят в каталоге и в карточке.'],['Свой профиль','Вкладка «Профиль»: имя, о себе, фото, цвет профиля. Ник менять нельзя.'],['Скачать и открыть','Нажми на карточку. APK установится, мир или мод Bedrock откроется в Minecraft, остальное скачается в загрузки.']];
  document.getElementById('sheet').innerHTML='<div class="grab"></div><div class="nm" style="font-size:22px;margin-bottom:16px">Как пользоваться</div>'+st.map(function(x,i){return '<div class="full" style="margin-bottom:14px"><b>'+(i+1)+'. '+x[0]+'</b><br>'+x[1]+'</div>'}).join('')+'<button class="btn pri" id="help-ok">Понятно</button>';
  document.body.classList.add('sh');
}

document.getElementById('list').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
