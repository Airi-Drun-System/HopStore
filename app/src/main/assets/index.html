<style>
:root{--primary:#6750A4;--on-primary:#fff;--pc:#EADDFF;--on-pc:#21005D;--sc:#E8DEF8;--on-sc:#1D192B;--tc:#FFD8E4;--on-tc:#31111D;--surface:#FEF7FF;--on-surface:#1D1B20;--sv:#ECE6F0;--outline:#79747E;--card:#F3EDF7;--bl:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--on-surface);font:400 14px/1.4 "Google Sans",Roboto,system-ui,sans-serif;overflow:hidden}
svg{display:block}button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;z-index:0}
.bgl{position:absolute;inset:0;overflow:hidden;background:var(--surface)}
.bgl .fx{position:absolute;inset:0}
.b-grad .fx{background:linear-gradient(180deg,var(--pc),transparent 60%)}
.b-aurora i{position:absolute;border-radius:50%;filter:blur(var(--bl));opacity:.55;animation:dr 18s ease-in-out infinite alternate}
.b-aurora i:nth-child(1){width:80%;height:50%;left:-20%;top:-10%;background:var(--primary);opacity:.35}
.b-aurora i:nth-child(2){width:70%;height:45%;right:-25%;top:25%;background:var(--tc);animation-delay:-6s}
.b-aurora i:nth-child(3){width:75%;height:45%;left:-10%;bottom:-15%;background:var(--pc);animation-delay:-11s}
@keyframes dr{to{transform:translate(12%,8%) scale(1.15)}}
.b-dots .fx{background:radial-gradient(var(--outline) 1.3px,transparent 1.8px) 0 0/22px 22px;opacity:.3}
.b-grid .fx{background:linear-gradient(var(--outline) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,var(--outline) 1px,transparent 1px) 0 0/30px 30px;opacity:.16;-webkit-mask-image:linear-gradient(#000,transparent 90%)}
.b-waves svg{position:absolute;left:0;bottom:0;width:100%;height:60%}
\.b-dia .fx{background:var(--outline);opacity:.12;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 6l8 18-8 18-8-18z' fill='black'/></svg>") 0 0/48px 48px}
.view{position:fixed;inset:0;z-index:1;overflow-y:auto;padding:env(safe-area-inset-top) 0 120px;display:none}
.view.on{display:block;animation:vi .28s cubic-bezier(.2,0,0,1)}

header{padding:36px 24px 8px}

h2{margin:20px 24px 8px;font-size:14px;font-weight:600;color:var(--primary)}
.sub{opacity:.7}
.glass{background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:inherit;outline:none}
.search input::placeholder{color:inherit;opacity:.6}
.feat{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.feat::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.fc{flex:none;width:272px;height:172px;border-radius:32px;padding:20px;position:relative;overflow:hidden;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end}
.fc .big{position:absolute;right:-14px;top:-14px;width:120px;height:120px;opacity:.22;transform:rotate(12deg)}
.fc .big svg{width:100%;height:100%}
.fc .nm{font-size:22px;font-weight:600;line-height:26px;position:relative}
.fc .au{font-size:13px;opacity:.8;display:flex;align-items:center;gap:6px;position:relative;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chip{flex:none;height:32px;border-radius:8px;border:1px solid var(--outline);background:none;display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:500}
.chip.on{background:var(--sc);color:var(--on-sc);border-color:transparent;padding-left:8px}
.chip svg{width:18px;height:18px}
.list{padding:8px 16px 0}
.app{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:2px;border-radius:6px;animation:in .4s cubic-bezier(.2,0,0,1) both;cursor:pointer}
.app:first-child{border-radius:28px 28px 6px 6px}.app:last-child{border-radius:6px 6px 28px 28px}.app:only-child{border-radius:28px}
.app:active{filter:brightness(.96)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.ic{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;overflow:hidden}
.ic svg{width:28px;height:28px}.ic img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.nm{font-size:16px;font-weight:600;line-height:22px;display:flex;align-items:center;gap:6px}
.au{display:flex;align-items:center;gap:6px;font-size:12.5px}
.meta{font-size:12px;opacity:.7}
.ds{font-size:13px;margin-top:3px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.bd{flex:none}
.go{width:48px;height:48px;border-radius:24px;border:0;flex:none;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;transition:border-radius .25s,transform .15s}
.go:active{transform:scale(.92);border-radius:16px}
.go.busy svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{text-align:center;opacity:.6;font-size:12px;padding:12px 16px}
.empty{text-align:center;padding:56px 24px;opacity:.85}
.empty .ic{width:80px;height:80px;border-radius:40px;margin:0 auto 16px;background:var(--pc);color:var(--on-pc)}
.empty .ic svg{width:36px;height:36px}
.sk{height:84px;margin:0 16px 2px;border-radius:6px;background:var(--card);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.5}}
/* авторы */
.pc{display:flex;align-items:center;gap:16px;padding:16px 20px;margin:0 16px 8px;border-radius:28px;cursor:pointer}
.pc .info .nm{font-size:17px}
.back{margin:12px 12px 0;width:48px;height:48px;border-radius:24px;border:0;background:none;display:grid;place-items:center}
.ph{text-align:center;padding:0 24px 12px}
.ph .av{width:96px;height:96px;font-size:40px;margin-bottom:12px}
.ph .nm{justify-content:center;font-size:26px;line-height:32px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--sc);color:var(--on-sc);font-size:12.5px;font-weight:500;margin:8px 0}
.ph p{margin:4px 0 0;opacity:.8}

.seg{display:flex;margin:0 16px;border:1px solid var(--outline);border-radius:20px;overflow:hidden;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.seg button{flex:1;height:40px;border:0;border-left:1px solid var(--outline);background:none;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--sc);color:var(--on-sc)}
.seg svg{width:18px;height:18px}
.sw{display:flex;flex-wrap:wrap;gap:12px;padding:0 20px}
.sw button{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff}
.sw button.on{outline:3px solid var(--on-surface);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;padding:0 16px}
.tile{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;border:0;padding:0;background:none;outline:1px solid var(--outline);--bl:14px}
.tile .tn{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 8px;text-align:center;font-weight:600;font-size:12.5px;background:linear-gradient(transparent,color-mix(in srgb,var(--surface) 90%,transparent))}
.tile.on{outline:3px solid var(--primary)}
.tile .ck{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.tile .ck svg{width:16px;height:16px}
.btn{margin:0 16px;height:48px;border-radius:24px;border:0;background:var(--sc);color:var(--on-sc);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 24px}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn svg,.back svg{width:22px;height:22px}
.search svg{flex:none}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;height:calc(80px + env(safe-area-inset-bottom));padding:12px 8px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

#nav svg{width:24px;height:24px}
#nav button.on{opacity:1;font-weight:700}
#nav button.on .pill{background:var(--pc);color:var(--on-pc)}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:86%;overflow-y:auto;background:var(--surface);border-radius:32px 32px 0 0;padding:12px 24px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,0,0,1)}
body.sh #scrim{opacity:1;pointer-events:auto}body.sh #sheet{transform:none}
.grab{width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.5;margin:0 auto 20px}
.sh-top{display:flex;gap:16px;align-items:center}
.sh-top .ic{width:72px;height:72px;border-radius:22px}.sh-top .ic svg{width:38px;height:38px}
.sh-top .nm{font-size:22px;line-height:28px}
.who{display:inline-flex;align-items:center;gap:8px;margin-top:4px;border:0;background:none;padding:0;font-weight:500;color:var(--primary)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.fact{height:28px;padding:0 12px;border-radius:14px;background:var(--sc);color:var(--on-sc);font-size:12.5px;font-weight:500;display:flex;align-items:center}
.full{font-size:14.5px;line-height:1.5;white-space:pre-wrap;margin-bottom:20px}
#sheet .btn{margin:0;width:100%;height:52px;border-radius:26px}
/* режим автора */
.fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:2;height:56px;border-radius:16px;padding:0 22px 0 18px;border:0;background:var(--pc);color:var(--on-pc);font-weight:600;font-size:15px;display:none;align-items:center;gap:10px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.fab svg{width:24px;height:24px}.fab:active{transform:scale(.96)}
.fl{display:block;margin:0 0 12px}.fl span{display:block;font-size:12px;font-weight:600;opacity:.7;margin:0 0 4px 4px}
.fl input,.fl select,.fl textarea{width:100%;border:0;border-radius:14px;background:var(--sv);color:inherit;font:inherit;font-size:16px;padding:14px 16px;outline:none}
.fl input:focus,.fl select:focus,.fl textarea:focus{box-shadow:0 0 0 2px var(--primary)}
.pg{height:6px;border-radius:3px;background:var(--sc);overflow:hidden;margin:12px 0 4px}.pg i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s}
#sheet .btn.dng{background:none;color:#d32f2f;margin-top:8px;height:48px}
#sheet .btn:disabled{opacity:.5}
body.na #nav,body.na .fab{display:none!important}

var apps=[],A={},cur='',tab='home',prof='';
function ext(f){return(String(f).split(/[?#]/)[0].match(/\.(\w+)$/)||[])[1]||''}
function kind(a){var e=ext(a.file||a.apk).toLowerCase(),t=a.type=='mc'?'bedrock':a.type;if(t&&IC[t]&&TYPES[t])return t;if(e=='apk')return'app';if(/^(mcworld|mcpack|mcaddon|mctemplate)$/.test(e))return'bedrock';if(/^(jar|mrpack|litemod)$/.test(e))return'java';return(a.file||a.apk)?'file':'app'}
function tone(a){var h=0,s=a.name||'';for(var i=0;i<s.length;i++)h+=s.charCodeAt(i);return['pc','sc','tc'][h%3]}

function cardHTML(a,i){return '<div class="app glass" data-i="'+apps.indexOf(a)+'" style="animation-delay:'+Math.min(i,8)*45+'ms"><div class="ic" style="background:var(--'+tone(a)+');color:var(--on-'+tone(a)+')">'+icon(a)+'</div><div class="info"><div class="nm">'+esc(a.name)+'</div><div class="au">'+who(a)+'</div><div class="meta">'+esc([a.version,a.size].concat((a.tags||[]).slice(0,2)).filter(Boolean).join(' · '))+'</div><div class="ds">'+esc(a.desc||'')+'</div></div><button class="go" aria-label="Скачать" data-i="'+apps.indexOf(a)+'">'+goIco(a)+'</button></div>'}

document.addEventListener('click',function(e){
  var t=e.target,b;
  if(b=t.closest('[data-am]')){amode=b.dataset.am;return drawAuth()}
  if(t.closest('#auth-go'))return doAuth();

  if(b=t.closest('[data-help]'))return openHelp();

/* аккаунты, профили и загрузка файлов с телефона */
